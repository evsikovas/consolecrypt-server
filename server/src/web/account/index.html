<!DOCTYPE html>
<!--
  SPDX-License-Identifier: AGPL-3.0-only
  Copyright (C) 2026 Alexander Evsikov <i@evsikov.net>

  Built-in account page of the ConsoleCrypt sync server (/account, opt-in with
  CC_WEB_ACCOUNT=true): confirm an email address, set a new account password
  with the single-use codes the server mails, and answer "This wasn't me" links.
  Nothing here can see or unlock vault data.
-->
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>ConsoleCrypt</title>
  <link rel="stylesheet" href="/account/app.css">
  <script src="/account/app.js" defer></script>
</head>
<body>
  <main class="card">
    <header>
      <strong>ConsoleCrypt</strong>
      <label class="language" hidden>
        <span data-message="language"></span>
        <select id="language">
          <option lang="ru" value="ru">Русский</option>
          <option lang="en" value="en">English</option>
          <option lang="es" value="es">Español</option>
          <option lang="zh-Hans" value="zh">简体中文</option>
        </select>
      </label>
    </header>
    <div id="app" aria-live="polite">
      <noscript><p>{{NO_SCRIPT}}</p></noscript>
    </div>
  </main>
</body>
</html>
