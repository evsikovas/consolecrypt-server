# Always supply the private server.env with --env-file. See docs/public/HOSTING.md.
# The server release is CC_SERVER_VERSION (server.env, default below; the
# release process keeps the default on the current release). CC_SERVER_IMAGE
# overrides the whole reference, e.g. with an immutable @sha256 digest.
name: consolecrypt-selfhost

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: consolecrypt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CC_POSTGRES_ADMIN_PASSWORD:?Run init-config.py first}
      CC_DATABASE_PASSWORD: ${CC_DATABASE_PASSWORD:?Run init-config.py first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-consolecrypt.sql:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d consolecrypt"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    stop_grace_period: 60s
    security_opt: [no-new-privileges:true]
    logging: *logging

  server:
    image: ${CC_SERVER_IMAGE:-ghcr.io/evsikovas/consolecrypt-server:${CC_SERVER_VERSION:-0.2.2}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CC_DATABASE_URL: postgres://consolecrypt@postgres:5432/consolecrypt
      CC_DATABASE_PASSWORD: ${CC_DATABASE_PASSWORD:?Run init-config.py first}
      CC_DATABASE_CONNECT_TIMEOUT_SECS: "60"
      CC_RUN_MIGRATIONS: ${CC_RUN_MIGRATIONS:-true}
      CC_LISTEN_ADDR: 0.0.0.0:8080
      CC_METRICS_LISTEN: "off"
      CC_PUBLIC_URL: ""
      CC_REGISTRATION_OPEN: ${CC_REGISTRATION_OPEN:-true}
      CC_REQUIRE_EMAIL_VERIFICATION: "true"
      CC_REQUIRE_REQUEST_PROOF: "true"
      CC_TRUST_PROXY_HEADERS: "true"
      CC_EVENT_BUS: postgres
      CC_HSTS: "true"
      CC_LOG_FORMAT: json
      CC_MAIL_TRANSPORT: ${CC_MAIL_TRANSPORT:-smtp}
      CC_MAIL_FROM: ${CC_MAIL_FROM:?Run init-config.py first}
      CC_SMTP_HOST: ${CC_SMTP_HOST:-}
      CC_SMTP_PORT: ${CC_SMTP_PORT:-587}
      CC_SMTP_TLS: ${CC_SMTP_TLS:-starttls}
      CC_SMTP_USERNAME: ${CC_SMTP_USERNAME:-}
      CC_SMTP_PASSWORD: ${CC_SMTP_PASSWORD:-}
      CC_OBJECT_SHARING_ENABLED: ${CC_OBJECT_SHARING_ENABLED:-false}
      CC_SHARED_GROUPS_ENABLED: ${CC_SHARED_GROUPS_ENABLED:-false}
      CC_SHARED_SECRETS_ENABLED: ${CC_SHARED_SECRETS_ENABLED:-false}
      CC_SHARED_KUBE_CONTEXTS_ENABLED: ${CC_SHARED_KUBE_CONTEXTS_ENABLED:-false}
      CC_SHARED_DB_CONNECTIONS_ENABLED: ${CC_SHARED_DB_CONNECTIONS_ENABLED:-false}
      CC_SHARED_NOTES_ENABLED: ${CC_SHARED_NOTES_ENABLED:-false}
      CC_SHARING_OWNER_ONLINE_ENROLLMENT_ENABLED: ${CC_SHARING_OWNER_ONLINE_ENROLLMENT_ENABLED:-false}
      CC_DEVICE_PROTECTION_ENABLED: ${CC_DEVICE_PROTECTION_ENABLED:-false}
      CC_NEW_DEVICE_MAIL_ENABLED: ${CC_NEW_DEVICE_MAIL_ENABLED:-true}
      CC_DEVICE_QUARANTINE_DAYS: ${CC_DEVICE_QUARANTINE_DAYS:-14}
      CC_TEAMS_ENABLED: ${CC_TEAMS_ENABLED:-true}
      # Server 0.2.2+: request limits (observe | enforce) and quotas.
      CC_RATE_LIMIT_MODE: ${CC_RATE_LIMIT_MODE:-observe}
      CC_QUOTAS_V2_ENABLED: ${CC_QUOTAS_V2_ENABLED:-true}
      CC_MAX_DEVICES_PER_ACCOUNT: ${CC_MAX_DEVICES_PER_ACCOUNT:-20}
      CC_MAX_VAULT_OBJECTS: ${CC_MAX_VAULT_OBJECTS:-100000}
      # The image carries the exact source URL of its build (AGPL §13). Set
      # CC_SOURCE_CODE_URL in an override file only for a modified build.
    ports:
      - "127.0.0.1:${CC_HTTP_PORT:-8080}:8080"
    networks: [database, frontend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    stop_grace_period: 30s
    # The immutable distroless image includes a binary /readyz healthcheck.
    # Do not replace it with curl, wget, a shell or a *_FILE wrapper.
    logging: *logging

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      CC_DOMAIN: ${CC_DOMAIN:?Run init-config.py first}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    logging: *logging

networks:
  database:
    internal: true
  frontend:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
