# Generic example only. Keep instance overrides and credentials outside Git.
fullnameOverride: consolecrypt
image:
  tag: 0.1.9
  pullPolicy: IfNotPresent
# Add imagePullSecrets when your registry requires authentication.
config:
  publicUrl: https://consolecrypt.example.org
  sourceCodeUrl: https://git.example.org/your-project/consolecrypt/-/tree/main
  requireRequestProof: true
  eventBus: postgres
# Existing Secret stores the PostgreSQL connection URL.
database:
  existingSecret: consolecrypt-database
  existingSecretKey: database-url
# Configure SMTP via private overrides and an existing Secret.
mail:
  transport: disabled
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: consolecrypt.example.org
      paths:
        - {path: /v1, pathType: Prefix}
        - {path: /healthz, pathType: Exact}
        - {path: /readyz, pathType: Exact}
  tls:
    - secretName: consolecrypt-tls
      hosts: [consolecrypt.example.org]
