apiVersion: v2
name: consolecrypt-server
description: >-
  Self-hosted zero-knowledge sync server for ConsoleCrypt. Stores only
  ciphertext, key envelopes, public keys and non-secret metadata; it cannot
  decrypt vault data and SSH traffic never goes through it.
type: application
# Chart version (SemVer). Bump on every chart change.
version: 0.1.14
# Version of consolecrypt-server this chart deploys by default (image tag).
appVersion: "0.1.12"
kubeVersion: ">=1.25.0-0"
home: https://github.com/evsikovas/consolecrypt-server
sources:
  - https://github.com/evsikovas/consolecrypt-server
keywords:
  - consolecrypt
  - ssh
  - sync
  - zero-knowledge
  - self-hosted
maintainers:
  - name: Alexander Evsikov
    email: i@evsikov.net
    url: https://github.com/evsikovas/consolecrypt-server
annotations:
