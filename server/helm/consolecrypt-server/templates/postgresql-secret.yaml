{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "consolecrypt-server.postgresql.fullname" . }}
{{- $password := .Values.postgresql.auth.password | toString }}
{{- if not .Values.postgresql.auth.password }}
{{- /* Keep a previously generated password across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "consolecrypt-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    # Kept on `helm uninstall`, like the data volume (PVC), so a reinstall can
    # still open the existing data. Delete both manually to wipe everything.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
