apiVersion: v1
kind: Service
metadata:
  name: {{ include "consolecrypt-server.fullname" . }}
  labels:
    {{- include "consolecrypt-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "consolecrypt-server.selectorLabels" . | nindent 4 }}
{{- if .Values.metrics.enabled }}
---
# Metrics only, cluster-internal. Deliberately a separate ClusterIP Service so
# changing service.type (LoadBalancer/NodePort) or adding an Ingress never
# exposes /metrics.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-metrics" (include "consolecrypt-server.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "consolecrypt-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "consolecrypt-server.selectorLabels" . | nindent 4 }}
{{- end }}
