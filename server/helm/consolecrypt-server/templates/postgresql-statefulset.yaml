{{- if .Values.postgresql.enabled }}
{{- /*
Bundled single-pod PostgreSQL for small installs. Not highly available, no
backups — use a managed database or an operator for production.
*/}}
{{- $pg := .Values.postgresql }}
{{- $pgName := include "consolecrypt-server.postgresql.fullname" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $pgName }}
  labels:
    {{- include "consolecrypt-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ $pgName }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "consolecrypt-server.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      # Only stable labels: a chart upgrade alone must not restart the database.
      labels:
        {{- include "consolecrypt-server.postgresql.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: consolecrypt
      {{- with $pg.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml $pg.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Give PostgreSQL time for a clean shutdown checkpoint.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: {{ include "consolecrypt-server.postgresql.image" . }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              value: {{ $pg.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ $pg.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "consolecrypt-server.postgresql.secretName" . }}
                  key: {{ include "consolecrypt-server.postgresql.secretKey" . }}
            # Subdirectory: volume roots may contain lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-U", {{ $pg.auth.username | quote }}, "-d", {{ $pg.auth.database | quote }}]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-U", {{ $pg.auth.username | quote }}, "-d", {{ $pg.auth.database | quote }}]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-U", {{ $pg.auth.username | quote }}, "-d", {{ $pg.auth.database | quote }}]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          securityContext:
            {{- toYaml $pg.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Writable paths needed with a read-only root filesystem.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not $pg.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $pg.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "consolecrypt-server.postgresql.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $pg.persistence.accessModes | nindent 10 }}
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
  {{- end }}
{{- end }}
