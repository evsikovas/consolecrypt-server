{{- include "consolecrypt-server.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "consolecrypt-server.fullname" . }}
  labels:
    {{- include "consolecrypt-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "consolecrypt-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: server
        # Roll the pods when configuration or chart-managed secrets change.
        checksum/config: {{ include "consolecrypt-server.configData" . | sha256sum }}
        checksum/secret: {{ include "consolecrypt-server.secretData" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "consolecrypt-server.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "consolecrypt-server.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if and .Values.postgresql.enabled .Values.postgresql.waitForReady }}
      initContainers:
        # Wait for the bundled PostgreSQL instead of crash-looping on first install.
        - name: wait-for-postgresql
          image: {{ include "consolecrypt-server.postgresql.image" . }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - sh
            - -c
            - until pg_isready -q -t 2; do echo "waiting for $PGHOST:$PGPORT"; sleep 2; done
          env:
            - name: PGHOST
              value: {{ include "consolecrypt-server.postgresql.fullname" . }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgresql.auth.database | quote }}
          securityContext:
            {{- $ids := dict "runAsUser" (.Values.postgresql.podSecurityContext.runAsUser | default 70) "runAsGroup" (.Values.postgresql.podSecurityContext.runAsGroup | default 70) }}
            {{- toYaml (merge (deepCopy .Values.postgresql.securityContext) $ids) | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      {{- end }}
      containers:
        - name: server
          image: {{ include "consolecrypt-server.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 9090
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "consolecrypt-server.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $env := include "consolecrypt-server.serverEnv" . | trim }}
          {{- if $env }}
          env:
            {{- $env | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if or (eq .Values.mail.transport "file") .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if eq .Values.mail.transport "file" }}
            - name: mail
              mountPath: {{ .Values.mail.file.dir }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (eq .Values.mail.transport "file") .Values.extraVolumes }}
      volumes:
        {{- if eq .Values.mail.transport "file" }}
        - name: mail
          emptyDir:
            sizeLimit: 64Mi
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
