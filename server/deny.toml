# cargo-deny policy for the server workspace (ADR-0005, server variant).
# Run from the repository root:
#   cargo deny --manifest-path server/Cargo.toml --locked check advisories bans sources licenses
# or everything at once: python3 server/scripts/dependency_audit.py check
# CI runs the same command in server.yml (validate) and dependency-audit.yml.
#
# The server is AGPL-3.0-only, so in addition to the permissive licenses
# allowed everywhere it may depend on GPL-3.0-compatible copyleft (LGPL-3.0,
# GPL-3.0, AGPL-3.0) — prefer permissive crates anyway. Never allowed:
# GPL-2.0-only (AGPL-incompatible), SSPL, BUSL, "non-commercial"/proprietary.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates fail only when a ConsoleCrypt crate depends on them directly.
unmaintained = "workspace"
# Every ignore needs a reason and a review date (docs/public/HOSTING.md).
# Owner of all exceptions: Alexander Evsikov (@evsikovas).
ignore = []

[licenses]
confidence-threshold = 0.9
# The server list is intentionally broader than the current dependency tree.
unused-allowed-license = "allow"
allow = [
    # Permissive — allowed for all components (ADR-0005).
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    # GPL-3.0-compatible copyleft — server only (ADR-0005).
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies (cc-protocol) of this private (publish = false) crate.
allow-wildcard-paths = true
# TLS is rustls-only.
deny = [
    { crate = "native-tls", reason = "TLS uses rustls" },
    { crate = "openssl", reason = "TLS uses rustls" },
    { crate = "openssl-sys", reason = "TLS uses rustls" },
]

[sources]
unknown-registry = "deny"
# No git dependencies: cc-protocol is a path dependency here.
unknown-git = "deny"
