# cargo-deny policy (ADR-0005) for cc-protocol. The client links this crate, so
# it follows the client's permissive-only policy, not the server variant.
# Run from the repository root:
#   cargo deny --manifest-path crates/Cargo.toml --locked check advisories bans sources licenses
# or everything at once: python3 server/scripts/dependency_audit.py check
# CI runs the same command in server.yml (validate) and dependency-audit.yml.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates fail only when a ConsoleCrypt crate depends on them directly.
unmaintained = "workspace"
# Every ignore needs a reason and a review date (docs/public/HOSTING.md).
# Owner of all exceptions: Alexander Evsikov (@evsikovas).
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
# The ADR-0005 permissive list is shared with the client; not every entry is used here.
unused-allowed-license = "allow"

# ConsoleCrypt code is AGPL-3.0-only; third-party policy remains unchanged.
# Own crates (cc-*) are unpublished (publish = false), so cargo-deny skips them
# here. dependency_audit.py checks the namespace rule instead: every skipped
# crate is cc-* and AGPL-3.0-only, so a new cc-* crate needs no exception entry.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# TLS is rustls-only.
deny = [
    { crate = "native-tls", reason = "TLS uses rustls" },
    { crate = "openssl", reason = "TLS uses rustls" },
    { crate = "openssl-sys", reason = "TLS uses rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
