# Version-update PRs are off (open-pull-requests-limit: 0): dependencies are
# bumped by hand. Dependabot alerts and security updates are off
# in the repository settings; vulnerable dependencies are reported by the
# weekly dependency-audit.yml issue instead. The schedule, groups and ignores
# stay so version updates can be turned back on by raising the limit.
# Dependabot PRs run only the hosted dependency-audit.yml checks.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /server
      - /crates
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      cargo-patch:
        update-types: [patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      actions-patch:
        update-types: [patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
